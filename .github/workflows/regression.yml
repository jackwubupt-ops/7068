name: PatchLoop regression
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    name: Offline tests / Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt "datasets>=3,<5"
      - name: Dependency consistency
        run: python -m pip check
      - name: Compile sources
        run: python -m compileall -q config.py pipeline_agent.py prompt_agent.py swebench_dev.py utils patchloop_task2 patchloop_app experiments tests
      - name: Offline test suite (scripted model replies; no API calls)
        run: python -m unittest discover -s tests -v
